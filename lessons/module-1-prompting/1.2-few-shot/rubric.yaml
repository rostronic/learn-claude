    description: "Wraps each example in <example> tags inside a single <examples> block, after the instruction, including each example's input and output"
    weight: 25
    check: code_review
  - id: includes_all_example_content
    description: "Every example's input and output text appears in the returned prompt"
    weight: 20
    check: code_review
