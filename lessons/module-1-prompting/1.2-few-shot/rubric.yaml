    description: "Does NOT accept single-class example sets — raises ValueError when labels are present and all identical (examples must be diverse/contrasting)"
    weight: 20
    check: anti_pattern
  - id: tests_pass
    description: "All tests in test_few_shot.py pass"
    weight: 15
    check: bash_execution
    command: "pytest test_few_shot.py -v"
