# CI for the Learn Claude platform. The repo teaches "Integrate Claude Code into
# CI/CD pipelines" (CCAF 3.6 / chapter 5.7), so it runs its own test suite in CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Structural & content validation (lessons, maps, questions, starters)
        run: python -m pytest tests/ -v

      - name: Grading MCP server tests
        run: python -m pytest -q
        working-directory: infra/grading-mcp

      - name: Progress MCP server tests
        run: python -m pytest -q
        working-directory: infra/progress-mcp
